# "Nossa base é a infraestrutura. Com este único arquivo e o comando 'docker-compose up',
# iniciamos nosso banco de dados MongoDB e uma interface gráfica para visualizá-lo,
# o Mongo Express. Isso nos dá um ambiente limpo e consistente para trabalhar."

version: "3.8"
services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=pass

  mongo-express:
    image: mongo-express:latest
    container_name: mongo-express
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongodb
      - ME_CONFIG_MONGODB_ADMINUSERNAME=admin
      - ME_CONFIG_MONGODB_ADMINPASSWORD=pass
      - ME_CONFIG_MONGODB_URL=mongodb://admin:pass@mongodb:27017/
    depends_on:
      - mongodb

volumes:
  mongo-data:
    driver: local
